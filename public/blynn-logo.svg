<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- B and D intertwined logo -->
  <!-- B letter - vertical stem -->
  <rect x="8" y="12" width="4" height="40" fill="black"/>
  
  <!-- B letter - top loop -->
  <rect x="12" y="12" width="12" height="4" fill="black"/>
  <rect x="20" y="16" width="4" height="8" fill="black"/>
  <rect x="12" y="20" width="12" height="4" fill="black"/>
  
  <!-- B letter - bottom loop -->
  <rect x="12" y="40" width="12" height="4" fill="black"/>
  <rect x="20" y="36" width="4" height="8" fill="black"/>
  <rect x="12" y="36" width="12" height="4" fill="black"/>
  
  <!-- D letter - vertical stem (shared with B) -->
  <rect x="8" y="12" width="4" height="40" fill="black"/>
  
  <!-- D letter - curved part -->
  <path d="M12 12 L24 12 L24 16 L20 16 L20 48 L24 48 L24 52 L12 52 L12 12 Z" fill="black"/>
  
  <!-- Swoosh element -->
  <path d="M24 16 Q32 8 40 16" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="40" cy="16" r="2" fill="black"/>
</svg>
